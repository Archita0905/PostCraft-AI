[build]
  # The site is the standalone HTML version of PostCraft AI at the repo root
  # (index.html, styles.css, script.js). Copy only those into dist/ so the
  # Python files, configs and docs aren't published.
  # The /api backend (AI generation + drafts) is the Netlify Server in
  # netlify/server/index.ts; drafts live in Netlify Database.
  command = "rm -rf dist && mkdir -p dist && cp index.html styles.css script.js dist/"
  publish = "dist"

# Local `netlify dev`: serve the static files directly instead of starting Vite.
[dev]
  framework = "#static"
  publish = "."
